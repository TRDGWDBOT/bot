# XAUBot — stack completo (MongoDB + backend FastAPI + frontend PWA con nginx)
# Avvio: docker compose up -d
# Aggiornamento: docker compose pull && docker compose up -d --build
# Log: docker compose logs -f

services:
  mongo:
    image: mongo:7
    container_name: xaubot-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # NIENTE porta esposta verso l'esterno: solo i container interni accedono.

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: xaubot-backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: xaubot
      DERIV_DEFAULT_APP_ID: "1089"
    depends_on:
      - mongo

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Lasciato vuoto: il frontend chiama "/api/..." sullo stesso host (proxy nginx)
        REACT_APP_BACKEND_URL: ""
    container_name: xaubot-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
